[platformio]
default_envs = chest, clip

[env]
platform = espressif32@7.0.1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = h2zero/NimBLE-Arduino@1.4.3

[env:chest]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM -DNOVA_CHEST
build_src_filter = +<common/> +<chest/>
extra_scripts = pre:patch_tof.py
lib_deps =
    ${env.lib_deps}
    stm32duino/STM32duino VL53L8CX@2.1.0

[env:clip]
board = esp32-c3-devkitm-1
board_build.partitions = huge_app.csv
build_flags = ${env.build_flags} -DNOVA_CLIP
build_src_filter = +<common/> +<clip/>
